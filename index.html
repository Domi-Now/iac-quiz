<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IaC Quiz Arena 🦁</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAME INPUT SCREEN -->
    <div id="name-screen">
        <h2>Welcome to the IaC Quiz Arena 🦁</h2>
        <p>Please enter your name:</p>
        <input type="text" id="player-name-input" placeholder="Your name">
        <button id="start-name-btn">Continue</button>
    </div>

    <!-- LEVEL SELECTION SCREEN -->
    <div id="level-screen" style="display:none;">
        <h2>Welcome, <span id="player-name-display"></span>!</h2>
        <p>Select a level:</p>
        <button onclick="startQuiz(1)">Start Level 1 – Beginner</button>
        <button onclick="startQuiz(2)">Start Level 2 – Intermediate</button>
        <button onclick="startQuiz(3)">Start Level 3 – Advanced</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" style="display:none;">
        <h2 id="question-title"></h2>
        <div id="question-container"></div>
        <button id="next-btn" style="display:none;">Next</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" style="display:none;">
        <h2 id="result-text"></h2>
        <button onclick="goBackToLevels()">Back to Levels</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
